anyswe_hermes:
  responses_api_agents:
    anyswe_agent:
      entrypoint: app.py
      domain: coding
      description: SWE-bench run by Hermes Agent natively inside the task container.
      value: Eval software engineering capabilities on SWE-bench with any Gym agent.

      agent_server_module: responses_api_agents.hermes_agent.app
      agent_server_class: HermesAgent
      agent_config_class: HermesAgentConfig
      agent_kwargs:
        model: model
        max_turns: 90
        temperature: 1.0
        terminal_backend: local
        enabled_toolsets: null

      container_formatter: ${oc.env:ANYSWE_CONTAINER_FORMATTER}
      sandbox_provider: sandbox
      agent_runtime_source: auto
      sandbox_model_base_url: ${oc.env:NEMO_GYM_SANDBOX_MODEL_BASE_URL,null}
      swebench_agent_timeout: 2700
      swebench_tests_timeout: 1800
      concurrency: 4

      model_server:
        name: policy_model
        type: responses_api_models

      datasets:
        - name: example
          type: example
          jsonl_fpath: responses_api_agents/anyswe_agent/data/example.jsonl
